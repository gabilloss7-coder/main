<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convite Especial</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Georgia', serif;
        background: linear-gradient(135deg, #f8e1e7, #fdf6f0);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
    }

    .card {
        background: #fff;
        width: 90%;
        max-width: 420px;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        text-align: center;
        position: relative;
    }

    h1, h2 {
        color: #7a1f3d;
        margin-bottom: 15px;
    }

    p {
        color: #444;
        line-height: 1.5;
    }

    .flowers {
        font-size: 26px;
        margin-bottom: 15px;
    }

    .wine {
        font-size: 24px;
        margin-top: 10px;
    }

    button {
        padding: 12px 25px;
        font-size: 16px;
        border-radius: 25px;
        border: none;
        cursor: pointer;
        margin: 10px;
    }

    .open-btn {
        background-color: #7a1f3d;
        color: white;
    }

    .yes-btn {
        background-color: #7a1f3d;
        color: white;
    }

    .no-btn {
        background-color: #ccc;
        color: #333;
        position: absolute;
    }

    .hidden {
        display: none;
    }
</style>
</head>
<body>

<div class="card" id="letter">
    <div class="flowers"> 🌷 </div>
    <h1>Carta de Convocação</h1>
    <p>
        <strong>Manuela Pietra</strong>,<br><br>
        Em conformidade com normas inexistentes, fica registrada a convocação oficial 
	para a abertura desta carta em ciência de um possível futuro encontro.
    </p>
    <button class="open-btn" onclick="openInvite()">Abrir a carta</button>
</div>

<div class="card hidden" id="invite">
    <div class="flowers"></div>
    <h2>Convocação</h2>
    <p>
        <br><br>
        Comparecer no dia<br>
        <strong>30 de janeiro</strong> 🍷<br><br>
        para a melhor aula de volante que vc já fez.
    </p>
    <div class="wine"></div>
    <br>
    <button class="yes-btn" onclick="accepted()">Aceitar</button>
    <button class="no-btn" id="noBtn">Não</button>
</div>

<script>
    function openInvite() {
        document.getElementById('letter').classList.add('hidden');
        document.getElementById('invite').classList.remove('hidden');
    }

    function accepted() {
        alert("Ótima escolha!");
    }

    const noBtn = document.getElementById('noBtn');

    noBtn.addEventListener('mouseover', moveButton);
    noBtn.addEventListener('touchstart', moveButton);

    function moveButton() {
        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 50);
        noBtn.style.left = x + 'px';
        noBtn.style.top = y + 'px';
    }
</script>

</body>
</html>
